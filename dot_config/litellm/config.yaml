# No api_key on purpose: Claude models use the subscription token Claude Code sends.
model_list:
  - model_name: "anthropic/*"
    litellm_params:
      model: "anthropic/*"

  # ChatGPT subscription via Codex OAuth; log in once outside the proxy with
  # python -c "from litellm.llms.chatgpt.authenticator import Authenticator; Authenticator().get_access_token()"
  - model_name: "chatgpt/*"
    model_info:
      mode: responses
    litellm_params:
      model: "chatgpt/*"

litellm_settings:
  callbacks: chatgpt_system_prompt.proxy_handler_instance

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
